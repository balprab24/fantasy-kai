# Test-only configuration, layered over src/main/resources/application.yml.
#
# JWT_SECRET has no default in application.yml on purpose -- a committed
# fallback secret is one that ships to production the first time someone
# forgets the environment variable. Tests still need *a* key, so this is it,
# and it is obviously not a real one.
fantasykai.auth.jwt-secret=test-only-signing-key-not-a-secret-32b+

# Actuator details are `when-authorized` in production. The schema tests assert
# on the body of /actuator/health, so they need them unconditionally.
management.endpoint.health.show-details=always

# Point Redis at nothing reachable.
#
# The default is localhost:6379, which on a developer machine is the live
# docker-compose Redis -- so a test that needed Redis and did not say so would
# silently use it, share buckets with every other run, and fail on the sixth
# login for reasons nothing in the test explains. That happened. A test that
# needs Redis now declares a container and overrides this.
spring.data.redis.host=redis.invalid
spring.data.redis.port=6379
