spring:
  application:
    name: fantasy-kai-backend

  # Port 5433 matches the published port in docker-compose.yml -- see the note there.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/fantasykai}
    username: ${DB_USERNAME:fantasykai}
    password: ${DB_PASSWORD:fantasykai}

  jpa:
    # Flyway owns the schema. `validate` fails fast if an entity ever drifts
    # from a migration; it must never become `update`.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Phase 5: details only for an authenticated caller. The freshness
      # component names every source and its last error, which is operational
      # detail rather than public information.
      show-details: when-authorized
      # ingestFreshness reports DOWN when the daily pull has stopped, which is
      # degraded rather than down -- the API still serves six seasons correctly.
      # A platform health check pointed at /actuator/health would therefore
      # restart a perfectly healthy machine every time the laptop slept through
      # 06:00. Phase 5's deploy points at /actuator/health/liveness instead.
      group:
        liveness:
          include: ping, db

fantasykai:
  auth:
    # No default, on purpose. A committed fallback secret is a secret that ships
    # to production the first time someone forgets the env var, and AuthProperties
    # refuses to start without at least 32 bytes.
    jwt-secret: ${JWT_SECRET}
    # Short because an access token cannot be revoked. The refresh token is the
    # revocable half and carries the session.
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    # Per IP, across /api/v1/auth/**. Handoff section 8.
    login-attempts-per-minute: 5
    # Explicit allowlist, never `*`. The Vercel origin is added at deploy.
    allowed-origins:
      - http://localhost:3000

  ingest:
    base-url: https://github.com/nflverse/nflverse-data/releases/download
    sleeper-base-url: https://api.sleeper.app
    # Six seasons. Volume is the point -- see the handoff doc section 9.
    first-season: 2020
    # 6am ET daily. In-season only; the job no-ops from March to August.
    cron: "0 0 6 * * *"
    scheduled-enabled: true
    # Both are one-shot switches, off by default -- see BackfillRunner and
    # IngestOnceRunner. `once` is what scripts/ingest-once.sh sets.
    backfill-on-startup: false
    once: false
