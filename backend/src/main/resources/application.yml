spring:
  application:
    name: fantasy-kai-backend

  # Port 5433 matches the published port in docker-compose.yml -- see the note there.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/fantasykai}
    username: ${DB_USERNAME:fantasykai}
    password: ${DB_PASSWORD:fantasykai}

  jpa:
    # Flyway owns the schema. `validate` fails fast if an entity ever drifts
    # from a migration; it must never become `update`.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Phase 5: details only for an authenticated caller. The freshness
      # component names every source and its last error, which is operational
      # detail rather than public information.
      show-details: when-authorized
      # ingestFreshness reports DOWN when the daily pull has stopped, which is
      # degraded rather than down -- the API still serves six seasons correctly.
      # A platform health check pointed at /actuator/health would therefore
      # restart a perfectly healthy machine every time the laptop slept through
      # 06:00. Phase 5's deploy points at /actuator/health/liveness instead.
      group:
        liveness:
          include: ping, db

fantasykai:
  auth:
    # No default, on purpose. A committed fallback secret is a secret that ships
    # to production the first time someone forgets the env var, and AuthProperties
    # refuses to start without at least 32 bytes.
    jwt-secret: ${JWT_SECRET}
    # Short because an access token cannot be revoked. The refresh token is the
    # revocable half and carries the session.
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    # Per IP, across /api/v1/auth/**. Handoff section 8.
    login-attempts-per-minute: 5
    # Explicit allowlist, never `*`. One comma-separated env var rather than a
    # yml list, because the production origins are not knowable at build time and
    # the previous shape had no mechanism to add them at all -- the comment said
    # "the Vercel origin is added at deploy" and nothing did it. Spring splits a
    # comma-separated string into the List<String> AuthProperties declares;
    # CorsBindingTests proves that, because binding a List from an environment
    # variable is exactly the thing that silently yields one element or none.
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}

  ingest:
    base-url: https://github.com/nflverse/nflverse-data/releases/download
    sleeper-base-url: https://api.sleeper.app
    # Six seasons. Volume is the point -- see the handoff doc section 9.
    first-season: 2020
    # 6am ET daily. In-season only; the job no-ops from March to August.
    cron: "0 0 6 * * *"
    scheduled-enabled: true
    # Both are one-shot switches, off by default -- see BackfillRunner and
    # IngestOnceRunner. `once` is what scripts/ingest-once.sh sets.
    backfill-on-startup: false
    once: false

# Honour X-Forwarded-* from the reverse proxy in front of this application.
#
# Without it Tomcat does not know TLS was terminated ahead of it,
# request.isSecure() is false, and Spring Security's HSTS writer -- which only
# emits on a secure request -- silently writes nothing. The
# httpStrictTransportSecurity() block in SecurityConfig then looks correct,
# compiles, and does nothing, so handoff section 8's "HTTPS only, HSTS on" row
# would have shipped unsatisfied.
#
# Found by curling the running stack and grepping the response headers, not by
# reading the config: x-frame-options and x-content-type-options were both
# present, and it is their presence that made the missing third one look like it
# was there.
#
# `framework` (Spring's ForwardedHeaderFilter) rather than `native` (Tomcat's
# RemoteIpValve): native needs an internal-proxies regex matching whatever
# address the proxy has on the container network, which is configuration that
# breaks quietly when the network changes. framework trusts the headers
# unconditionally -- safe here only because nothing can reach this application
# except through Caddy (compose.prod.yml gives the backend `expose` and no
# published port) and Caddy replaces X-Forwarded-* rather than passing a
# client's through. Both halves of that are load-bearing: publishing the
# backend's port would make a forged X-Forwarded-Proto enough to fake a secure
# request.
server:
  forward-headers-strategy: framework
