spring:
  application:
    name: fantasy-kai-backend

  # Port 5433 matches the published port in docker-compose.yml -- see the note there.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/fantasykai}
    username: ${DB_USERNAME:fantasykai}
    password: ${DB_PASSWORD:fantasykai}

  jpa:
    # Flyway owns the schema. `validate` fails fast if an entity ever drifts
    # from a migration; it must never become `update`.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Local convenience. Tighten to `when-authorized` in Phase 5 once auth exists.
      show-details: always

fantasykai:
  ingest:
    base-url: https://github.com/nflverse/nflverse-data/releases/download
    sleeper-base-url: https://api.sleeper.app
    # Six seasons. Volume is the point -- see the handoff doc section 9.
    first-season: 2020
    # 6am ET daily. In-season only; the job no-ops from March to August.
    cron: "0 0 6 * * *"
    scheduled-enabled: true
    # Both are one-shot switches, off by default -- see BackfillRunner and
    # IngestOnceRunner. `once` is what scripts/ingest-once.sh sets.
    backfill-on-startup: false
    once: false
