# Handoff §8: "Dependabot on."
#
# Weekly rather than daily: this is a solo project and a PR queue nobody reads
# is the same as no Dependabot at all. Grouped for the same reason -- one PR a
# week that CI has already run is actionable; fifteen are noise.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns: ["org.springframework*", "io.spring*"]
      test:
        patterns: ["org.testcontainers*", "com.redis*", "org.junit*", "org.assertj*"]
      # jjwt, bucket4j and bouncycastle matched no group, so they arrived as
      # loose PRs -- and bouncycastle is the Argon2id provider, which is the
      # last dependency that should be waiting behind noise.
      auth:
        patterns: ["io.jsonwebtoken*", "com.bucket4j*", "org.bouncycastle*"]

    # Boot 4 is its own phase -- north-star section 10 row 11.5, after the perf
    # pass -- and not a weekly PR. Measured twice rather than predicted: PR #11
    # and PR #21 both die before a single test runs, because Boot 4's
    # spring-boot-dependencies no longer manages org.testcontainers:postgresql or
    # :junit-jupiter, both of which pom.xml declares version-less, so the POM
    # does not parse at all. #21 was merged anyway on 2026-09-18 and main could
    # not build for the three days until 2026-09-21. Same reasoning as the
    # typescript/eslint holds further down: a PR that always fails is the queue
    # nobody reads. Drop this when phase 11.5 starts.
    ignore:
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react*"]
      tanstack:
        patterns: ["@tanstack/*"]
      tooling:
        patterns: ["typescript", "eslint*", "tailwindcss", "@tailwindcss/*", "@types/node"]
    # Both of these are gated on the same thing: eslint-config-next bundles its
    # own typescript-eslint and eslint-plugin-react, and neither supports the
    # next major. Measured on PR #17 rather than assumed --
    #   typescript 7.0.2  -> "typescript-eslint does not support TS 7.0"
    #                        (their issue #10940 tracks TS >= 7.1)
    #   eslint 10.10.0    -> eslint-plugin-react calls context.getFilename(),
    #                        which eslint 10 removed. TypeError, exit 2.
    # In both cases `npm run build` passes and `npm run lint` dies, so the
    # frontend CI job catches it -- but an ungated weekly PR that always fails
    # is the "queue nobody reads" this file's header is about. Drop these two
    # ignores when eslint-config-next ships support; nothing else is held back.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
