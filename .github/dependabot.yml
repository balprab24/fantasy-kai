# Handoff §8: "Dependabot on."
#
# Weekly rather than daily: this is a solo project and a PR queue nobody reads
# is the same as no Dependabot at all. Grouped for the same reason -- one PR a
# week that CI has already run is actionable; fifteen are noise.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns: ["org.springframework*", "io.spring*"]
      test:
        patterns: ["org.testcontainers*", "com.redis*", "org.junit*", "org.assertj*"]
      # jjwt, bucket4j and bouncycastle matched no group, so they arrived as
      # loose PRs -- and bouncycastle is the Argon2id provider, which is the
      # last dependency that should be waiting behind noise.
      auth:
        patterns: ["io.jsonwebtoken*", "com.bucket4j*", "org.bouncycastle*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
