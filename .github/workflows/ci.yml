name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so the vulnerability scan keeps running between commits.
    - cron: '0 6 * * 1'

jobs:
  backend:
    name: Build, test, migrate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Runners ship Docker, so the Testcontainers suite boots a real
      # PostgreSQL 16 and applies the Flyway migrations for real.
      - name: Build and test
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    name: Lint and build the web shell
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Node 20 reached end of life 2026-04-30. Read from .nvmrc so the version
      # is a repo fact rather than something each machine decides for itself.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # Lint before build, and never `continue-on-error`: the React 19 hook
      # rules caught three real setState-in-effect bugs while this shell was
      # being written, which is also why TypeScript is pinned to 6.x -- 7.0
      # disables typescript-eslint entirely.
      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  # Handoff section 8: "mvn dependency-check in CI." Separate job so a CVE in a
  # transitive dependency reports without blocking a green test run, and
  # scheduled so it keeps finding things after the last commit lands -- a
  # vulnerability is disclosed on its own timetable, not on ours.
  dependencies:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # The NVD API refuses a zero-length key outright, so passing an unset
      # secret through is worse than omitting it: the job fails on
      # configuration rather than on a CVE, every run, and stops being read.
      # Skip loudly instead, and start working the moment the secret exists.
      - name: Check for an NVD API key
        id: nvd
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping the vulnerability scan: no NVD_API_KEY secret." \
              "Get a free key at https://nvd.nist.gov/developers/request-an-api-key" \
              "and add it under Settings > Secrets and variables > Actions."
          fi

      - name: OWASP dependency-check
        if: steps.nvd.outputs.present == 'true'
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >-
          ./mvnw -B org.owasp:dependency-check-maven:check
          -DfailBuildOnCVSS=7
          -DnvdApiKey="$NVD_API_KEY"

      - name: Upload report
        if: always() && steps.nvd.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html
